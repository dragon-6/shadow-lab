  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #05060a;
      --panel: rgba(14, 17, 26, 0.78);
      --card: rgba(22, 26, 39, 0.72);
      --border: rgba(255, 255, 255, 0.08);
      --border-hi: rgba(139, 92, 246, 0.45);
      --accent: #8b5cf6;
      --accent-2: #ec4899;
      --accent-cyan: #38bdf8;
      --glow: rgba(139, 92, 246, 0.35);
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #10b981;
      --warn: #f59e0b;
      --danger: #f43f5e;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    [hidden] {
      display: none !important;
    }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 12% 18%, rgba(139, 92, 246, 0.22), transparent 42%),
        radial-gradient(circle at 88% 82%, rgba(236, 72, 153, 0.16), transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.65), transparent 100%);
      color: var(--text);
      user-select: none;
    }

    .app-shell {
      width: 100%;
      max-width: 1360px;
      height: 100vh;
      margin: 0 auto;
      padding: 16px 22px;
      display: grid;
      grid-template-rows: 58px 1fr;
      gap: 16px;
    }

    /* 상단 바 */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(24px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 30%, #c4b5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid;
      place-items: center;
      font-size: 16px;
      box-shadow: 0 0 18px var(--glow);
      -webkit-text-fill-color: initial;
    }

    .badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 12px;
      font-weight: 700;
      padding: 6px 13px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .badge:empty {
      display: none;
    }

    #phaseBadge {
      color: #ddd6fe;
      background: rgba(139, 92, 246, 0.16);
      border-color: rgba(139, 92, 246, 0.35);
    }

    #myRoleBadge[data-role="host"] {
      color: #fde68a;
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.35);
    }

    #myRoleBadge[data-role="member"] {
      color: #bae6fd;
      background: rgba(56, 189, 248, 0.14);
      border-color: rgba(56, 189, 248, 0.3);
    }

    #wsStatusBadge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
    }

    #wsStatusBadge[data-state="online"] {
      color: #a7f3d0;
    }
    #wsStatusBadge[data-state="online"]::before {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    #wsStatusBadge[data-state="connecting"]::before {
      background: var(--warn);
    }

    #wsStatusBadge[data-state="offline"] {
      color: #fecdd3;
    }
    #wsStatusBadge[data-state="offline"]::before {
      background: var(--danger);
    }

    /* 메인 무스크롤 레이아웃 (좌: 내 카메라 + 실시간 플레이어 목록 / 우: 스테이지) */
    .main-grid {
      display: grid;
      grid-template-columns: 310px 1fr;
      gap: 16px;
      height: 100%;
      min-height: 0;
    }

    .side-dock {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
      min-height: 0;
    }

    /* 내 카메라 카드 */
    .cam-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      backdrop-filter: blur(24px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .cam-card[data-streaming="true"] {
      border-color: var(--accent-2);
      box-shadow: 0 0 28px rgba(236, 72, 153, 0.3);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }

    .cam-card[data-streaming="true"] .live-dot {
      background: var(--accent-2);
      box-shadow: 0 0 10px var(--accent-2);
      animation: blink 0.8s infinite alternate;
    }

    @keyframes blink {
      from { opacity: 0.35; }
      to { opacity: 1; }
    }

    .cam-box {
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: #000;
      border: 1px solid var(--border);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9);
    }

    #localVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: block;
    }

    /* 상시 표시되는 플레이어(대기/플레이 중) 카드 */
    .players-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
      backdrop-filter: blur(24px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
    }

    #userList {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      min-height: 0;
      flex: 1;
    }

    #userList li {
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 9px;
      transition: transform 0.15s, border-color 0.15s;
    }

    #userList li::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
      flex-shrink: 0;
    }

    #userList li.is-me {
      border-color: var(--border-hi);
      background: rgba(139, 92, 246, 0.14);
    }

    #userList li.is-host {
      box-shadow: inset 3px 0 0 var(--warn);
    }

    #userList li.is-disconnected {
      opacity: 0.45;
      border-color: rgba(244, 63, 94, 0.35);
    }

    #userList li.is-disconnected::before {
      background: var(--danger);
      box-shadow: none;
    }

    #userList li .user-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #userList li .user-score {
      margin-left: auto;
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 800;
      color: #c4b5fd;
      background: rgba(139, 92, 246, 0.16);
      border: 1px solid rgba(139, 92, 246, 0.32);
      padding: 2px 8px;
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
    }

    /* 우측 메인 스테이지 공통 */
    .stage-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px 28px;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      backdrop-filter: blur(24px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
      overflow: hidden;
    }

    .stage-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .stage-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.03em;
    }

    /* 폼 & 버튼 */
    .control-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin: auto 0;
      width: 100%;
      max-width: 560px;
      align-self: center;
    }

    .glass-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .box-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input {
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      background: rgba(8, 10, 16, 0.85);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
    }

    input:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #nicknameInput {
      flex: 1;
    }

    .opt-grid {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }

    .field input {
      width: 100%;
    }

    button {
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      padding: 12px 18px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      cursor: pointer;
      transition: transform 0.15s, background 0.2s, box-shadow 0.2s;
    }

    button:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-cta {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.04em;
      border: none;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      box-shadow: 0 12px 28px -6px var(--glow);
    }

    .btn-cta:hover:not(:disabled) {
      box-shadow: 0 16px 34px -4px var(--glow);
    }

    #startHint {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-align: center;
      min-height: 18px;
    }

    #startHint[data-ready="true"] {
      color: var(--success);
    }

    /* 인게임 화면 (3열 HUD + 4:3 비율 유지 타일 레이아웃) */
    #screen-game {
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 14px;
    }

    .hud-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.18), rgba(236, 72, 153, 0.12));
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-md);
      position: relative;
      overflow: hidden;
    }

    .hud-left {
      display: flex;
      align-items: center;
      justify-self: start;
    }

    #roundDisplay {
      font-size: 13px;
      font-weight: 800;
      color: #ddd6fe;
      letter-spacing: 0.06em;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(139, 92, 246, 0.22);
      border: 1px solid rgba(139, 92, 246, 0.4);
      white-space: nowrap;
    }

    #topicDisplay {
      grid-column: 2;
      justify-self: center;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -0.03em;
      color: #fff;
      text-shadow: 0 0 24px var(--glow);
      text-align: center;
      white-space: nowrap;
    }

    #countdownDisplay {
      grid-column: 3;
      justify-self: end;
      font-size: 20px;
      font-weight: 900;
      color: var(--warn);
      font-variant-numeric: tabular-nums;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.35);
      white-space: nowrap;
    }

    #countdownDisplay:empty {
      display: none;
    }

    #countdownDisplay[data-urgent="true"] {
      color: var(--danger);
      background: rgba(244, 63, 94, 0.16);
      border-color: rgba(244, 63, 94, 0.45);
      animation: blink 0.4s infinite alternate;
    }

    .progress-track {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 4px;
      background: rgba(255, 255, 255, 0.06);
    }

    #countdownProgressBar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 0.25s linear;
    }

    #statusMessage {
      font-size: 14px;
      font-weight: 700;
      color: #c4b5fd;
      text-align: center;
      min-height: 20px;
    }

    #statusMessage:empty {
      display: none;
    }

    /* 플레이어 마스킹 타일 그리드 */
    #maskedStreamList {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 420px));
      justify-content: center;
      align-content: center;
      gap: 16px;
      height: 100%;
      min-height: 0;
    }

    #maskedStreamList:has(.masked-tile:only-child) {
      grid-template-columns: minmax(0, 480px);
    }

    .masked-tile {
      width: 100%;
      aspect-ratio: 4 / 3;
      max-height: 100%;
      background: radial-gradient(circle at 50% 45%, #111522 0%, #030408 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: grid;
      grid-template-rows: 1fr auto;
      min-height: 0;
      position: relative;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.55);
    }

    .masked-tile:not(.has-frame)::before {
      content: "실루엣 스트리밍 대기 중...";
      position: absolute;
      inset: 0 0 33px 0;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.02em;
      pointer-events: none;
    }

    .masked-tile.is-me {
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.25);
    }

    .masked-tile.is-disconnected {
      opacity: 0.45;
      border-color: var(--danger);
    }

    .masked-stage {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    .masked-tile img.masked-frame {
      width: 100%;
      height: 100%;
      min-height: 0;
      object-fit: contain;
      display: block;
      transform: scaleX(-1);
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .masked-tile.has-frame img.masked-frame {
      opacity: 1;
    }

    .masked-tile img.topic-frame-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transform: scaleX(-1);
      pointer-events: none;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .masked-tile.has-topic-frame img.topic-frame-overlay {
      opacity: 1;
    }

    .masked-label {
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      background: rgba(14, 17, 26, 0.92);
      border-top: 1px solid var(--border);
      color: var(--text);
    }

    /* 결과 및 게임오버 */
    .result-body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
      flex: 1;
      min-height: 0;
      max-width: 620px;
      width: 100%;
      margin: 0 auto;
    }

    #roundResultList,
    #rankingList {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      min-height: 0;
    }

    #roundResultList li,
    #rankingList li {
      padding: 14px 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #roundResultList li.is-top,
    #rankingList li.rank-1 {
      border-color: rgba(245, 158, 11, 0.55);
      background: linear-gradient(90deg, rgba(245, 158, 11, 0.18), rgba(22, 26, 39, 0.8));
      color: #fef08a;
    }

    #roundResultList li.is-me,
    #rankingList li.is-me {
      outline: 1px solid var(--accent);
    }

    .ranking-left {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .ranking-title-badge {
      font-size: 12px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(139, 92, 246, 0.22);
      border: 1px solid rgba(139, 92, 246, 0.45);
      color: #ddd6fe;
    }

    #rankingList li.rank-1 .ranking-title-badge {
      background: rgba(245, 158, 11, 0.24);
      border-color: rgba(245, 158, 11, 0.55);
      color: #fde68a;
    }

    #myResult {
      font-size: 28px;
      font-weight: 900;
      text-align: center;
      padding: 18px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.22), rgba(236, 72, 153, 0.22));
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #fff;
    }

    #myResult:empty {
      display: none;
    }

    #resultStatus {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-align: center;
      min-height: 18px;
    }

    /* ==========================================================
       미적용(Dirty) 및 조건 위반(Invalid) 강조 스타일
       ========================================================== */
    .field input[data-dirty="true"] {
      border-color: var(--warn);
      background: rgba(245, 158, 11, 0.14);
      color: #fde68a;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25), 0 0 18px rgba(245, 158, 11, 0.35);
    }

    .field:has(input[data-dirty="true"]) span::after {
      content: " · 미적용";
      color: var(--warn);
      font-weight: 900;
    }

    .field input[data-invalid="true"],
    #nicknameInput[data-invalid="true"] {
      border-color: var(--danger) !important;
      background: rgba(244, 63, 94, 0.16) !important;
      color: #fecdd3 !important;
      box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.3), 0 0 20px rgba(244, 63, 94, 0.45) !important;
    }

    .field:has(input[data-invalid="true"]) span::after {
      content: " · 범위 오류!";
      color: var(--danger);
      font-weight: 900;
    }

    #optionSubmitBtn[data-dirty="true"]:not(:disabled) {
      background: linear-gradient(135deg, var(--warn), #ea580c);
      border-color: #fbbf24;
      color: #fff;
      box-shadow: 0 0 22px rgba(245, 158, 11, 0.65);
      animation: dirtyPulse 1s infinite alternate;
    }

    @keyframes dirtyPulse {
      from { transform: scale(1); box-shadow: 0 0 14px rgba(245, 158, 11, 0.45); }
      to { transform: scale(1.05); box-shadow: 0 0 26px rgba(245, 158, 11, 0.85); }
    }

    /* ==========================================================
       임팩트 토스트 알림창 (#impactToastContainer)
       ========================================================== */
    #impactToastContainer {
      position: fixed;
      top: 78px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      width: max-content;
      max-width: 90vw;
    }

    .impact-toast {
      padding: 14px 26px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: -0.01em;
      color: #fff;
      background: rgba(15, 18, 30, 0.96);
      border: 2px solid var(--accent);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.75), 0 0 28px var(--glow);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: toastPopIn 0.32s cubic-bezier(0.22, 1.35, 0.5, 1) forwards;
    }

    .impact-toast[data-type="success"] {
      border-color: var(--success);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.75), 0 0 30px rgba(16, 185, 129, 0.55);
    }

    .impact-toast[data-type="error"] {
      border-color: var(--danger);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.75), 0 0 32px rgba(244, 63, 94, 0.65);
      animation: toastShakeIn 0.38s ease forwards;
    }

    .impact-toast[data-type="warn"] {
      border-color: var(--warn);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.75), 0 0 30px rgba(245, 158, 11, 0.6);
    }

    .impact-toast.is-leaving {
      animation: toastFadeOut 0.22s ease forwards;
    }

    @keyframes toastPopIn {
      0% { opacity: 0; transform: translateY(-24px) scale(0.82); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes toastShakeIn {
      0% { opacity: 0; transform: translateY(-16px) scale(0.9); }
      35% { opacity: 1; transform: translateX(-8px) scale(1.03); }
      65% { transform: translateX(8px) scale(1.03); }
      85% { transform: translateX(-4px); }
      100% { transform: translateX(0) scale(1); }
    }

    @keyframes toastFadeOut {
      to { opacity: 0; transform: translateY(-14px) scale(0.92); }
    }
  </style>
</head>
<body>
  <div id="impactToastContainer" aria-live="polite"></div>

  <div class="app-shell">
    <header class="top-bar">
      <div class="logo">
        <span class="logo-mark">🌒</span>
        <span>SHADOW LAB</span>
      </div>
      <div class="badge-row">
        <span id="myRoleBadge" class="badge"></span>
        <span id="phaseBadge" class="badge">LOBBY</span>
        <span id="wsStatusBadge" class="badge" data-state="connecting">연결 중...</span>
      </div>
    </header>

    <main class="main-grid">
      <!-- 좌측 고정 패널: 내 카메라 + 대기/플레이 중인 플레이어 목록 상시 표시 -->
      <aside class="side-dock">
        <div id="localVideoCard" class="cam-card" data-streaming="false">
          <div class="card-top">
            <span class="live-indicator">
              <span class="live-dot"></span>
              <span>MY CAM</span>
            </span>
            <span id="camStatusBadge"></span>
          </div>
          <div class="cam-box">
            <video id="localVideo" autoplay muted playsinline></video>
          </div>
        </div>

        <div class="players-card">
          <div class="card-top">
            <span>PLAYERS</span>
            <span id="userCountBadge">0명 접속 중</span>
          </div>
          <ul id="userList"></ul>
        </div>
      </aside>

      <!-- 1~2단계: 대기실 -->
      <section id="screen-lobby" class="stage-panel">
        <div class="stage-header">
          <h2 class="stage-title">LOBBY</h2>
        </div>

        <div class="control-stack">
          <div class="glass-box">
            <span class="box-title">NICKNAME (2~12자)</span>
            <div class="input-row">
              <input id="nicknameInput" type="text" placeholder="닉네임 입력 (2~12자, 공백 불가)" />
              <button id="nicknameSubmitBtn" type="button">확인</button>
            </div>
          </div>

          <div class="glass-box">
            <span class="box-title">OPTIONS</span>
            <div class="opt-grid">
              <label class="field">
                <span>ROUNDS</span>
                <input id="roundInput" type="number" step="1" />
              </label>
              <label class="field">
                <span>TIME (SEC)</span>
                <input id="timeInput" type="number" step="1" />
              </label>
              <button id="optionSubmitBtn" type="button">적용</button>
            </div>
          </div>

          <button id="gameStartBtn" class="btn-cta" type="button">GAME START</button>
          <p id="startHint"></p>
        </div>

        <div></div>
      </section>

      <!-- 3단계: 인게임 -->
      <section id="screen-game" class="stage-panel" hidden>
        <div class="hud-bar">
          <div class="hud-left">
            <span id="roundDisplay">ROUND 1 / 5</span>
          </div>
          <div id="topicDisplay">—</div>
          <div id="countdownDisplay"></div>
          <div class="progress-track">
            <div id="countdownProgressBar"></div>
          </div>
        </div>

        <p id="statusMessage"></p>

        <div id="maskedStreamList"></div>
      </section>

      <!-- 3-3~3-4단계: 라운드 결과 -->
      <section id="screen-result" class="stage-panel" hidden>
        <div class="stage-header">
          <h2 id="roundResultTitle" class="stage-title">RESULT</h2>
        </div>
        <div class="result-body">
          <ul id="roundResultList"></ul>
          <p id="resultStatus"></p>
        </div>
        <div></div>
      </section>

      <!-- 4단계: 게임 종료 -->
      <section id="screen-gameover" class="stage-panel" hidden>
        <div class="stage-header">
          <h2 class="stage-title">FINAL RANKING</h2>
        </div>
        <div class="result-body">
          <h3 id="myResult"></h3>
          <ol id="rankingList"></ol>
          <button id="playAgainBtn" class="btn-cta" type="button">PLAY AGAIN</button>
        </div>
        <div></div>
      </section>
    </main>
  </div>

  <script type="module" src="./js/main.js?v=8"></script>
</body>
</html>
