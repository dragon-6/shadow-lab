<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <title>그림자 연구소</title>
  <defs>
    <!-- 배경: 좌상단 보라 → 우하단 핑크 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8c60e6"/>
      <stop offset="0.5" stop-color="#ab59c0"/>
      <stop offset="1" stop-color="#cc5599"/>
    </linearGradient>
    <!-- 달의 어두운 면 -->
    <linearGradient id="dark" x1="0.3" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#9577c4"/>
      <stop offset="0.5" stop-color="#7a5fa6"/>
      <stop offset="1" stop-color="#4c3670"/>
    </linearGradient>
    <!-- 초승달(밝은 면) -->
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf5b2"/>
      <stop offset="0.6" stop-color="#f3d98a"/>
      <stop offset="1" stop-color="#c98a6a"/>
    </linearGradient>
    <clipPath id="moon"><circle cx="20" cy="22" r="10"/></clipPath>
  </defs>

  <!-- 둥근 사각형 배경 -->
  <rect width="40" height="40" rx="9" fill="url(#bg)"/>

  <g clip-path="url(#moon)">
    <!-- 밝은 면: 달 전체를 노랗게 깔고 -->
    <rect x="10" y="12" width="20" height="20" fill="url(#lit)"/>
    <!-- 어두운 면: 왼쪽으로 치우친 타원이 위를 덮어 오른쪽에 초승달만 남김 -->
    <ellipse cx="18" cy="22" rx="8.2" ry="10.2" fill="url(#dark)"/>
    <!-- 크레이터와 하이라이트 -->
    <ellipse cx="16" cy="19" rx="2.7" ry="2.6" fill="#5b4382" opacity="0.75"/>
    <ellipse cx="21.2" cy="25.3" rx="2.2" ry="1.7" fill="#5a4380" opacity="0.7"/>
    <ellipse cx="14.8" cy="28.3" rx="2.6" ry="2.2" fill="#43345f" opacity="0.6"/>
    <ellipse cx="21.5" cy="18.6" rx="3" ry="2.2" fill="#b49bd8" opacity="0.35"/>
  </g>
</svg>